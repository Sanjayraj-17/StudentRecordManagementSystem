
<div class="container mt-4">

  <!-- Add Student Component -->
  <app-add-student></app-add-student>

  <h2 class="text-center mb-4 mt-4">Student Records</h2>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- Edit Student Form -->
  <div *ngIf="selectedStudentId !== null"
       class="card shadow-sm mb-4">

    <div class="card-header bg-success text-white">
      <h5 class="mb-0">Edit Student</h5>
    </div>

    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text"
               class="form-control"
               [(ngModel)]="editStudentData.name">
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email"
               class="form-control"
               [(ngModel)]="editStudentData.email">
      </div>

      <div class="mb-3">
        <label class="form-label">Department</label>
        <select class="form-select"
                [(ngModel)]="editStudentData.department">

          <option value="CSE">CSE</option>
          <option value="IT">IT</option>
          <option value="ECE">ECE</option>
          <option value="EEE">EEE</option>
          <option value="MECH">MECH</option>
          <option value="CIVIL">CIVIL</option>

        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number"
               class="form-control"
               [(ngModel)]="editStudentData.age">
      </div>

      <button class="btn btn-success me-2"
              (click)="updateStudent()">
        Update Student
      </button>

      <button class="btn btn-secondary"
              (click)="cancelEdit()">
        Cancel
      </button>

    </div>
  </div>

  <!-- Student Table -->
  <div class="table-responsive">

    <table class="table table-bordered table-striped table-hover">

      <thead class="table-dark">
        <tr>
          <th>Student ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Age</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let student of students()">

          <td>{{ student.studentId }}</td>
          <td>{{ student.name }}</td>
          <td>{{ student.email }}</td>
          <td>{{ student.department }}</td>
          <td>{{ student.age }}</td>

          <td>
            <button class="btn btn-warning btn-sm me-2"
                    (click)="editStudent(student)">
              Edit
            </button>

            <button class="btn btn-danger btn-sm"
                    (click)="deleteStudent(student.studentId!)">
              Delete
            </button>
          </td>

        </tr>

        <tr *ngIf="students().length === 0 && !errorMessage">
          <td colspan="6" class="text-center">
            No students found.
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>
